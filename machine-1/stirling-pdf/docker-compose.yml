services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    env_file:
      - ${ENV_BASE}/_${COMPOSE_PROJECT_NAME}.env
    ports:
      - "${STIRLING_PORT:-3002}:8080"
    volumes:
      - ./stirling-data/tessdata:/usr/share/tessdata  # OCR language files
      - ./stirling-data/configs:/configs               # Settings & database
      - ./stirling-data/logs:/logs                     # Application logs
      - ./stirling-data/pipeline:/pipeline             # Automation configs
    environment:
      - SECURITY_ENABLELOGIN=${STIRLING_SECURITY_ENABLELOGIN:-false}      # Opt out of login (default is true / enabled)
      - SYSTEM_DEFAULTLOCALE=${STIRLING_SYSTEM_DEFAULTLOCALE:-en-GB}      # Default interface language
      - TZ=${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null -w '%{http_code}' http://localhost:8080/login | grep -q '200'"]
      interval: 10s   # Changed from 5s to avoid spamming a heavy Java app
      timeout: 10s
      retries: 5      # Reduced from 16 to be more practical
