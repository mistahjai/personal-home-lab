services:
  dind:
    image: docker:dind:24
    container_name: dind
    restart: unless-stopped
    runtime: sysbox-runc
    env_file:
      - .env
    environment:
      - DOCKER_TLS_CERTDIR=  # disable TLS for internal trusted network
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
    volumes:
      - dind-data:/var/lib/docker
      - ${WORKSPACE_PATH:-/workspace}:/workspace
    networks:
      - dind-net
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  dind-data:
    external: true

networks:
  dind-net:
    external: true
