services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${HOST_IP_PORT}:5678"
    env_file:
      - ${ENV_BASE}/_${COMPOSE_PROJECT_NAME}.env
    environment:
      - DB_TYPE=postgresdb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_BASE}/_${COMPOSE_PROJECT_NAME}.env
    volumes:
      - n8n_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
  n8n_pg:   
