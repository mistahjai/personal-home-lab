services:
  llama-server:
    image: llama-prism-sycl:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - CACHE_BUST_PRISM=1
        - CACHE_BUST_TORCHIT=1
        - CACHE_BUST_GGML=1
        - CACHE_BUST_SWAP=1
      cache_from:
        [llama-prism-sycl:latest]
    container_name: llama-sycl
    entrypoint: ["/app/llama-swap"]
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${GID:-39}"
      - "${UID:-105}"
    cap_add:
      - DAC_OVERRIDE
    shm_size: "${SHM_SIZE:-2g}"
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-12.5G}
    volumes:
      - ${MODELS_FOLDER_PATH}:/models:ro
      - ./config:/config:ro
    environment:
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - GGML_SYCL_ENABLE_OPT=1
      - GGML_SYCL_ENABLE_HOST_PINNED_MEM=1 # default
      - ZES_ENABLE_SYSMAN=0 # default (was 1 earlier)
      - UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS=1 # default = 0
      - GGML_SCHED_MAX_COPIES=1
      - LLAMA_SWAP_CONFIG=${CONFIG_FILE:-config.yam}
      - LLAMA_SWAP_LISTEN=${HOST:-0.0.0.0}:${PORT:-8080}
      # - LLAMA_SWAP_WATCH_CONFIG="false"
      # - GGML_SYCL_PINNED_MEMORY=1 # not in SYCL.md (llama.cpp)
      # - UR_L0_USE_IMMEDIATE_COMMANDLISTS=1 # not in SYCL.md (llama.cpp)
      # - ZE_LOADER_DEBUG=1 # not in SYCL.md (llama.cpp)
      # - SYCL_UR_TRACE=2 # not in SYCL.md (llama.cpp)
      # - SYCL_CACHE_PERSISTENT=1 # not recommended by llama.cpp docs
      # - SYCL_CACHE_DIR=/root/.cache # not recommended by llama.cpp docs
    command:
      - "-config"
      - "${CONFIG_FILE:-config.yaml}"
      - "-listen"
      - "${HOST:-0.0.0.0}:${PORT:-8080}"
