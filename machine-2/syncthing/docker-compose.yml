services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config:/config
      - ${DATA_PATH}:/data
      - ${OBSIDIAN_DATA_PATH}:/obsidian/obsidianData
networks: {}
